services:
    db:
        image: mcr.microsoft.com/mssql/server:2019-latest
        user: root
        restart: unless-stopped
        ports: 
        - "${MSSQL_PORT:?error}:1433"
        environment:
            ACCEPT_EULA: Y
            MSSQL_DATABASE: master
            MSSQL_USER: sa
            MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:?error}
            MSSQL_PID: "Express"
        volumes:
        - mssqlsystem:/var/opt/mssql
        - mssqluser:/var/opt/sqlserver
        networks:
            internal_network:
                ipv4_address: 1.0.0.1
    backend:
        build: "./backend"
        ports:
        - "80:80"
        restart: unless-stopped
        networks:
            internal_network:
                ipv4_address: 1.0.0.2
    frontend:
        build: "./frontend"
        ports:
        - "8080:80"
        restart: unless-stopped
        networks:
            internal_network:
                ipv4_address: 1.0.0.3              
networks:
    internal_network:
        driver: bridge
        ipam:
            config:
            - subnet: 1.0.0.0/29
              gateway: 1.0.0.4        
volumes:
    mssqlsystem:
        driver: local
    mssqluser:
        driver: local        
